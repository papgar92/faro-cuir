<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faro Cuir · Observatorio de derechos LGTBI+</title>
    <!--
      Icono en línea, sin fichero binario y sin petición extra: sin esto el
      navegador pide /favicon.ico y se lleva un 404 en cada carga. Son las franjas
      de la bandera trans, las mismas del encabezado y con los mismos colores.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 5 5'%3E%3Crect width='5' height='5' fill='%235ec8e8'/%3E%3Crect y='1' width='5' height='3' fill='%23e9a5be'/%3E%3Crect y='2' width='5' height='1' fill='%23f2efe9'/%3E%3C/svg%3E"
    />
    <!--
      Aquí había un <link> a fonts.googleapis.com y dos preconnect. Se fueron el 2026-09-05
      (ADR 0033) y no por rendimiento: cargar las tipografías desde Google hace que el navegador
      de cada visitante mande su IP a Google en cada carga, y la sección 6.4 dice que el sistema
      no registra IPs de quien consulta la web. Ahora se sirven desde `public/fonts/` y las
      declara `src/index.css`. No hay ningún origen externo en esta página, que es lo que
      permite que la CSP diga `default-src 'self'` sin excepciones.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
