[project]
name = "farocuir-backend"
version = "0.1.0"
description = "Backend de Faro Cuir: vigilancia normativa de derechos LGTBI+/trans en boletines oficiales españoles."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    # Driver binario: evita depender de libpq-dev/build tools en la imagen de Docker.
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # Cliente HTTP saliente de la ingesta (CLAUDE.md sección 3). Pasa de dependencia de
    # desarrollo a de producción: ya no lo usa solo el TestClient de FastAPI, ahora es lo que
    # hay debajo de security/url_guard.py.
    "httpx>=0.27",
    # Parseo de XML no confiable (CLAUDE.md 6.1). Obligatorio por diseño: el XML de las
    # fuentes nunca pasa por xml.etree ni por lxml sin endurecer.
    "defusedxml>=0.7",
    # Extraccion de la capa de texto de PDF no confiable (CLAUDE.md 6.1). Elegida entre
    # pdfminer.six y PyMuPDF por tres motivos que importan aqui: es **Python puro**, asi que no
    # mete binarios del sistema en la imagen ni en la auditoria; es **MIT**, mientras PyMuPDF es
    # AGPL y arrastraria una decision de licencia que este proyecto no necesita tomar; y su
    # superficie es pequena, que es lo que se pide de algo que va a comerse entrada hostil.
    # NUNCA se usa directamente: la puerta es security/pdf_safe.py, igual que xml_safe con XML.
    "pypdf>=5.1",
    # Cliente del almacen de objetos compatible con S3 (ADR 0032). NUNCA se usa directamente:
    # la puerta es services/almacen_remoto.py, igual que xml_safe con el XML y url_guard con el
    # HTTP de la ingesta. Se elige boto3 antes que firmar SigV4 a mano sobre httpx porque
    # escribir sesenta lineas de HMAC propias en el camino de escritura del archivo de la 6.5
    # es peor idea que una dependencia mas, y antes que la API nativa de Backblaze porque el
    # dialecto S3 deja cambiar de proveedor (B2, R2, S3, Minio) sin tocar codigo.
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # defusedxml no trae anotaciones propias; sin estos stubs mypy estricto no puede
    # comprobar security/xml_safe.py, que es justo donde más interesa que compruebe.
    "types-defusedxml>=0.7",
    # boto3 tampoco trae anotaciones propias, y mypy corre en estricto sobre services/, que es
    # donde vive el cliente del almacen. Sin estos stubs, el modulo que escribe el archivo de
    # la 6.5 seria el unico sin comprobar.
    "boto3-stubs[s3]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 persigue defaults mutables creados una sola vez al definir la función. En FastAPI,
# `Depends()` y `Query()` en el default son la forma idiomática de declarar dependencias y
# parámetros: devuelven marcadores que FastAPI resuelve en cada petición, no estado
# compartido. Se declaran inmutables en vez de sembrar el router de `# noqa`.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
