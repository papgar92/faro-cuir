name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # El frontend NO entraba en el CI hasta el 2026-09-05, y se notó: llevaba tiempo sin compilar
  # limpio -un import sin usar en `MapaPage`- sin que nadie lo supiera, y `vitest` aparecía en la
  # tabla de stack de CLAUDE.md sin estar en `package.json`. O sea que ninguna de las seis
  # pantallas tenía una sola prueba, ni siquiera la comprobación de que existe el tipo.
  #
  # Job aparte y no pasos dentro de `quality` a propósito: son dos cadenas de herramientas
  # distintas y corren en paralelo, así que el CI no tarda más. Y cuando algo se rompe, el nombre
  # del job ya dice de qué lado está.
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # **Node 24, y el numero importa.** El job se estreno con el 20 y `vitest` reventó con
      # `webidl.util.markAsUncloneable is not a function`: es `undici` dentro de `jsdom` pidiendo
      # una API que el 20 no tiene. `jsdom@30` declara `engines: ^22.22.2 || ^24.15.0`, pero
      # `npm ci` solo AVISA de eso, no lo bloquea — asi que en local pasaba (Node 24) y aqui no.
      #
      # La misma version esta en `netlify.toml` y declarada en `package.json`. Tres sitios y un
      # numero: si alguno se queda atras, vuelve a fallar solo aqui.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` y no `npm install`: instala exactamente el lock, sin resolver versiones nuevas
      # en el servidor. Una dependencia que cambia sola entre el commit y el CI es justo lo que
      # la sección 3 quiere evitar.
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: tsc (comprobación de tipos)
        working-directory: frontend
        run: npm run typecheck

      - name: vitest
        working-directory: frontend
        run: npm test

      # La compilación es la última comprobación y no es redundante con `tsc`: Vite resuelve las
      # importaciones de verdad, así que aquí es donde se ve una ruta rota o un fichero de
      # `public/` que no existe.
      - name: Compilación de producción
        working-directory: frontend
        run: npm run build

      # Que las tipografías viajen al build es una propiedad de PRIVACIDAD, no de empaquetado:
      # si faltaran, el navegador se las pediría a Google y la IP de cada visitante viajaría a un
      # tercero, que es lo que la 6.4 no admite (ADR 0033). Se comprueba aquí porque es
      # exactamente el tipo de cosa que se rompe en un refactor sin que nadie lo mire.
      - name: La web no depende de ningún tercero
        working-directory: frontend
        run: |
          set -euo pipefail
          test "$(ls dist/fonts/*.woff2 | wc -l)" -eq 8
          if grep -rqE '(href|src)="https?://|url\(["'"'"']?https?://' dist/index.html dist/assets/*.css; then
            echo "Hay una carga desde un origen externo en el build:"
            grep -roE '(href|src)="https?://[^"]+|url\(["'"'"']?https?://[^)"'"'"']+' dist/index.html dist/assets/*.css
            exit 1
          fi
          echo "8 woff2 propias y ninguna carga externa"

  quality:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: farocuir
          POSTGRES_PASSWORD: farocuir_ci
          POSTGRES_DB: farocuir
          # Mismo mecanismo de collation que docker-compose.yml (ver ADR 0001 / commit
          # de docker-compose): ICU es-ES en vez de locale glibc.
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-ES --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farocuir -d farocuir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://farocuir:farocuir_ci@localhost:5432/farocuir
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: ruff check
        working-directory: backend
        run: ruff check .

      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .

      # Equivalente a "mypy backend/app" (CLAUDE.md sección 10) ejecutado desde backend/.
      - name: mypy
        working-directory: backend
        run: mypy app

      # No lo pidió el enunciado explícitamente, pero ya que el job levanta una DB real
      # para pytest, verificar que la migración aplica limpia es casi gratis y evita que
      # una migración rota solo se descubra el día que alguien la corre en local.
      - name: Migraciones (alembic upgrade head)
        working-directory: backend
        run: alembic upgrade head

      - name: pytest
        working-directory: backend
        run: pytest --cov

      # CLI oficial de gitleaks descargada directamente (sin la Action de marketplace,
      # que en repos de organización exige licencia). --no-git: escanea los archivos tal
      # como están en el checkout, no el historial completo — el checkout es superficial
      # (fetch-depth por defecto) así que escanear "git log" daría una cobertura parcial
      # y engañosa; lo que importa en cada push/PR es qué hay en el árbol de trabajo.
      # Cierra el hueco que THREAT-MODEL.md 4.6 tenía marcado como pendiente: hasta ahora
      # las dependencias estaban fijadas pero nadie comprobaba si alguna tenía una
      # vulnerabilidad conocida. Se ejecuta contra el entorno ya instalado, así que cubre
      # también las transitivas, que es donde suele estar el problema.
      #
      # Falla el job a propósito. Un aviso que no rompe nada se ignora a la tercera semana;
      # si un CVE obliga a parar y mirar, es justo lo que tiene que pasar en un proyecto de
      # un máster de ciberseguridad. Si algún día bloquea por algo sin arreglo disponible,
      # la salida es `--ignore-vuln` con el identificador y un comentario que diga por qué,
      # nunca desactivar el paso.
      - name: pip-audit (vulnerabilidades en dependencias)
        working-directory: backend
        run: |
          # El propio pip entra en la auditoría, y la primera ejecución encontró
          # PYSEC-2026-2876 en pip 25.0.1. Se actualiza antes de auditar: dejar la
          # herramienta sin parchear y luego auditar con ella es contradictorio.
          python -m pip install --upgrade pip
          pip install pip-audit
          # --skip-editable: nuestro propio paquete se instala con -e y no está en PyPI, así
          # que sin esto el paso falla por no poder auditarse a sí mismo.
          # Sin --strict a propósito: --strict convierte ese salto en error y choca con lo
          # anterior. Sin él, pip-audit sigue devolviendo código != 0 si encuentra una
          # vulnerabilidad, que es exactamente lo que tiene que romper el job.
          pip-audit --skip-editable --progress-spinner off

      - name: gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=$(curl -sSf https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -oP '"tag_name": "v\K[^"]+')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --no-banner --redact
