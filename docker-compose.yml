# Nombre de proyecto explicito: el nombre de la carpeta local (Centinela/) no ha
# cambiado, pero los nombres de contenedor/red/volumen deben reflejar el nombre
# de producto actual (Faro Cuir) y no depender de como se llame el checkout local.
name: farocuir

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Collation ICU en espanol (mecanismo recomendado desde PostgreSQL 15+, no requiere
      # generar locales glibc en la imagen). La busqueda full-text de documentos usa la
      # configuracion `spanish` incorporada de Postgres, que es independiente de esto:
      # este ajuste solo afecta a como se ordena/compara texto (ORDER BY, indices btree).
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-ES --encoding=UTF8"
    volumes:
      - farocuir_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    # Ollama corre en la MAQUINA del humano, no en la red de compose. Dentro de un
    # contenedor, 127.0.0.1 es el propio contenedor, asi que el valor por defecto de
    # `llm_base_url` (correcto fuera de docker) aqui no encuentra nada. `host.docker.internal`
    # resuelve al host; `extra_hosts` lo garantiza tambien donde Docker no lo trae de serie.
    # Sobreescribible, pero NO a cualquier sitio: desde 2026-08-09 `config.py` valida el host
    # al arrancar contra un conjunto cerrado (6.9.2) y falla cerrado si no encaja. Sirve para
    # mover el puerto o alternar 127.0.0.1/host.docker.internal, no para apuntar a un Ollama
    # remoto — eso amplia la excepcion del ADR 0006 y necesita su propio ADR.
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      # La watchlist del eje referencial (CLAUDE.md seccion 4) vive en config/, a la altura
      # del repo y no dentro de backend/, asi que sin este montaje el contenedor no la ve.
      # SOLO LECTURA: el pipeline la consulta, nunca la escribe. Un fichero de configuracion
      # que el proceso puede reescribir deja de ser configuracion versionada.
      - ./config:/config:ro
    ports:
      - "127.0.0.1:8000:8000"
    # `--no-access-log`: el log de acceso de uvicorn escribe la IP del cliente en CADA peticion,
    # y la 6.4 dice literalmente que no se registran las IPs de quien consulta. Estaba desde S0 y
    # nadie lo habia mirado; se ve al leer el log del panel de revision (ADR 0017), donde la
    # contradiccion es mas visible porque ahi si hay una persona identificable detras. Lo que el
    # proyecto quiere registrar -que normas se revisaron y que se aprobo- lo escriben los logs
    # de la aplicacion, sin direcciones.
    #
    # UN SOLO PROCESO, sin `--workers`: las sesiones y la cadencia del panel viven en memoria
    # del proceso (ver `api/revision.py`). Con varios, la cadencia se multiplicaria y eso falla
    # ABIERTO.
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload",
       "--no-access-log"]
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    # Ollama corre en la MAQUINA del humano, no en la red de compose. Dentro de un
    # contenedor, 127.0.0.1 es el propio contenedor, asi que el valor por defecto de
    # `llm_base_url` (correcto fuera de docker) aqui no encuentra nada. `host.docker.internal`
    # resuelve al host; `extra_hosts` lo garantiza tambien donde Docker no lo trae de serie.
    # Sobreescribible, pero NO a cualquier sitio: desde 2026-08-09 `config.py` valida el host
    # al arrancar contra un conjunto cerrado (6.9.2) y falla cerrado si no encaja. Sirve para
    # mover el puerto o alternar 127.0.0.1/host.docker.internal, no para apuntar a un Ollama
    # remoto — eso amplia la excepcion del ADR 0006 y necesita su propio ADR.
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      # La watchlist del eje referencial (CLAUDE.md seccion 4) vive en config/, a la altura
      # del repo y no dentro de backend/, asi que sin este montaje el contenedor no la ve.
      # SOLO LECTURA: el pipeline la consulta, nunca la escribe. Un fichero de configuracion
      # que el proceso puede reescribir deja de ser configuracion versionada.
      - ./config:/config:ro
    # Sin cron todavia: solo demuestra que el contenedor arranca y queda en pie.
    # La ejecucion periodica real (worker/run.py + cron) llega en la sesion de ingesta.
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  farocuir_db_data:
