services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Collation ICU en espanol (mecanismo recomendado desde PostgreSQL 15+, no requiere
      # generar locales glibc en la imagen). La busqueda full-text de documentos usa la
      # configuracion `spanish` incorporada de Postgres, que es independiente de esto:
      # este ajuste solo afecta a como se ordena/compara texto (ORDER BY, indices btree).
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-ES --encoding=UTF8"
    volumes:
      - centinela_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
    # Sin cron todavia: solo demuestra que el contenedor arranca y queda en pie.
    # La ejecucion periodica real (worker/run.py + cron) llega en la sesion de ingesta.
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  centinela_db_data:
